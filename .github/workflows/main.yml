name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Project Boilerplate
        run: |
          cd flutter_app
          # Back up the original code and pubspec
          cp -r lib lib_backup
          cp pubspec.yaml pubspec_backup.yaml
          
          # Force create the android project structure with native Android support
          flutter create --project-name=kopran_breakdown_app --overwrite --org com.kopran.breakdown --platforms=android .
          
          # Restore the original user code and pubspec
          rm -rf lib
          mv lib_backup lib
          rm -f pubspec.yaml
          mv pubspec_backup.yaml pubspec.yaml

          # Explicitly set minSdkVersion to 21 to support image_picker and native dependencies
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion 16/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle || true

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build APK for Release
        run: |
          cd flutter_app
          flutter build apk --release --no-shrink

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kopran_breakdown_app_apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
