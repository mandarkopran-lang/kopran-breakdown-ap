name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build APK for Release
        run: |
          cd flutter_app
          flutter build apk --release --no-shrink

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kopran_breakdown_app_apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
